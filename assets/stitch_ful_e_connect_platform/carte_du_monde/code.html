<!-- Simple JS for Interactive Pins -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const pins = document.querySelectorAll('.pin-trigger');
            const previewCard = document.getElementById('preview-card');
            const closeBtn = document.getElementById('close-preview');
            
            const titleEl = document.getElementById('preview-title');
            const subtitleEl = document.getElementById('preview-subtitle');
            const imgEl = document.getElementById('preview-img');
            const iconEl = document.getElementById('preview-icon');

            pins.forEach(pin => {
                pin.addEventListener('click', (e) => {
                    // Prevent map click from closing immediately
                    e.stopPropagation();

                    // Get data
                    const name = pin.getAttribute('data-name');
                    const count = pin.getAttribute('data-count');
                    const role = pin.getAttribute('data-role');
                    const location = pin.getAttribute('data-location');
                    const imgUrl = pin.getAttribute('data-img');

                    // Populate Card
                    titleEl.textContent = name;
                    
                    if (count) {
                        subtitleEl.textContent = `${count} Members in this area`;
                        imgEl.classList.add('hidden');
                        iconEl.classList.remove('hidden');
                    } else {
                        subtitleEl.textContent = `${role} • ${location}`;
                        if (imgUrl) {
                            imgEl.src = imgUrl;
                            imgEl.setAttribute('data-alt', 'A portrait photo of the selected network member.');
                            imgEl.classList.remove('hidden');
                            iconEl.classList.add('hidden');
                        }
                    }

                    // Show Card
                    previewCard.classList.remove('translate-y-[120%]', 'opacity-0');
                    previewCard.classList.add('translate-y-0', 'opacity-100');
                });
            });

            // Close Card Logic
            const closeCard = () => {
                previewCard.classList.remove('translate-y-0', 'opacity-100');
                previewCard.classList.add('translate-y-[120%]', 'opacity-0');
            };

            closeBtn.addEventListener('click', closeCard);
            
            // Click outside to close (on the map area)
            document.querySelector('main').addEventListener('click', (e) => {
                if(!previewCard.contains(e.target) && !e.target.closest('.pin-trigger')) {
                    closeCard();
                }
            });
        });
    </script>
