name: fulbe
description: "Fulɓe Connect — Plateforme communautaire mondiale pour la diaspora Peule"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  meta: ^1.15.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  emoji_picker_flutter: ^4.4.0
  phosphoricons_flutter: ^1.0.0
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  app_links: ^7.1.2
  qr_flutter: ^4.1.0
  add_2_calendar: ^3.1.0
  file_picker: ^3.0.4
  path: ^1.9.1
  record: ^7.1.0
  audioplayers: ^6.7.1
  video_thumbnail: ^0.5.6
  agora_rtc_engine: ^6.5.1
  permission_handler: ^11.3.1
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  url_launcher: ^6.2.0
  agora_token_generator: ^1.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences: ^2.2.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo_fulbe_connect.png"
  adaptive_icon_foreground: "assets/logo/logo_fulbe_connect.png"
  adaptive_icon_background: "#00674F"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/logo_fulbe_connect.png"
  macos:
    generate: true
    image_path: "assets/logo/logo_fulbe_connect.png"
  windows:
    generate: true
    image_path: "assets/logo/logo_fulbe_connect.png"
  linux:
    generate: true
    image_path: "assets/logo/logo_fulbe_connect.png"

flutter:
  uses-material-design: true

  # Assets — logo et ressources graphiques
  assets:
    - assets/logo/

  # Inter font embedded via assets
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
